# ==============================================================================
# PREMIXTRACK DOCKER COMPOSE CONFIGURATION
# Kiến trúc Proxmox NUC 6 CAY: LXC100 (Gateway) -> LXC101 (App) -> LXC102 (MSSQL)
# ==============================================================================

version: '3.8'

services:
  premixtrack-app:
    container_name: premixtrack-app
    build:
      context: .
      dockerfile: Dockerfile
    image: premixtrack-app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Địa chỉ IP của LXC102 chạy MS SQL Server 2022
      - DB_SERVER=192.168.1.202
      - DB_PORT=1433
      - DB_USER=sa
      - DB_NAME=PremixTrackDB
      - DB_ENCRYPT=false
    # Giới hạn tài nguyên để LXC101 (2GB RAM) hoạt động mượt mà và an toàn
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
